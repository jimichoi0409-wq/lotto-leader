# 시험용: GitHub 서버(미국)에서 아일랜드 공식 결과 페이지가 열리는지만 확인합니다 (저장·커밋 없음).
# 확인이 끝나면 이 파일은 지워도 됩니다.
name: Probe Irish Lotto source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check lottery.ie pages
        run: |
          UA="LottoLeader-DataCollector/1.0 (+mailto:jnhteamsoft@gmail.com)"
          curl -sS -A "$UA" -o terms.html "https://www.lottery.ie/legal/terms-and-conditions"
          python3 - <<'EOF'
          import re, html
          t = open("terms.html", encoding="utf-8", errors="replace").read()
          text = re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", t)))
          print("약관 길이:", len(text))
          for k in ("copyright", "intellectual property", "reproduc", "commercial", "results", "automated", "scrap", "crawl"):
              for m in list(re.finditer(k, text, re.I))[:3]:
                  print(f"[{k}]", text[max(0, m.start() - 250):m.start() + 350])
                  print()
          EOF
